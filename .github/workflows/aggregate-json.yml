name: Aggregator — JSON sweep (api/woo/shopify)

# The cheap half of the scrape, split out of aggregate.yml so it can run more often.
#
# Why split at all: a WAF that refuses GitHub's datacenter IPs takes an operator out for a whole
# day when there is only one run. Three JSON sweeps give a transient 403 two more chances the
# same day, on top of the retry added in lib/fetcher.mjs. These operators are a single cheap JSON
# endpoint each, so a sweep is minutes, not the hour the browser sweep needs.
#
# It still needs FlareSolverr: 3 `woo` operators carry fetcher:"flaresolverr". It does NOT need
# Chromium — no operator here is browser-driven.
#
# ⚠️ The publish gate assumes two observations a DAY apart. Running more often would collapse
# that into "twice in one afternoon", which manager/PROMPT.md explicitly forbids the cowork
# routine from doing. MIN_OBSERVATION_GAP_MS below is what keeps that rule true; do not remove it
# while this schedule is more frequent than daily.

on:
  schedule:
    # Every 6h, deliberately NOT at 07:00 — that hour belongs to the render sweep, and the
    # cowork routine is scheduled after it.
    - cron: "0 1,13,19 * * *"
  workflow_dispatch: {}

concurrency:
  # The SAME group as aggregate.yml, so the two sweeps queue instead of overlapping. Overlap
  # would matter: AUTO_PUBLISH_MAX is a per-process counter, so two concurrent runs would each
  # cap independently and publish double what the budget allows.
  group: aggregator
  cancel-in-progress: false

jobs:
  aggregate-json:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # JSON endpoints only — the browser sweep is the slow one
    permissions:
      contents: read
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: warning
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Same gate as the render sweep: the suite is offline and Chromium-free on purpose, and a
      # failing gate must skip the scrape rather than let a broken parser write to the site.
      - name: Run parser/gate tests
        run: bun run test:scraper

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8191/health >/dev/null 2>&1 || curl -fsS http://localhost:8191/ >/dev/null 2>&1; then
              echo "FlareSolverr is up"; exit 0
            fi
            echo "waiting for FlareSolverr ($i/40)…"; sleep 3
          done
          echo "::warning::FlareSolverr never came up — its 3 woo operators will fail safe to 0 draws"

      - name: Scrape the JSON operators → gate → insert drafts
        id: scrape
        run: bun run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLARESOLVERR_URL: http://localhost:8191/v1
          DRY_RUN: "false"
          METHODS: "api,woo,shopify" # everything that is a JSON endpoint; render has its own workflow
          PUBLISH_STATUS: "draft" # a FIRST sighting is never auto-published
          AUTO_PUBLISH: "true"
          # THE GUARD THIS SPLIT DEPENDS ON. Without it, three sweeps a day would let a draft
          # earn its "second independent observation" six hours after the first — nearly the same
          # fetch — and the two-observation rule the whole quality model rests on would be
          # meaningless. 18h keeps it close to the ~24h it was before the split.
          MIN_OBSERVATION_GAP_MS: "64800000" # 18h
          # RAISED 12 → 50 on 2026-09-07, with a measurement behind it. In the 2026-09-06 run,
          # 167 rows cleared the entire publish gate and 155 of them were held ONLY because the
          # cap was reached — the cap was discarding 93% of already-qualified inventory, while
          # 215 drafts had already reached their draw date unpublished and were lost for good.
          #
          # The cap was never a quality filter; the gate is. Every row it releases has been seen
          # by two independent scrapes at least 18h apart agreeing on price, cap, draw day and
          # title, with clean field flags, a category, and an image proven to load. What the cap
          # bounds is how much a SCORING mistake could reach before someone noticed — and the
          # audit pass now re-checks every live row against its page daily, which is a far
          # better bound than a small number.
          #
          # 50 -> 110 per run. The DAILY ceiling goes 200 -> 400, deliberately and in one place
          # (test/workflows.test.mjs owns that number): 60 on the render sweep + 110 x 3 here.
          # manager/PROMPT.md's "raise 50 -> 200" was written when there was ONE run a day, so
          # per-run and per-day were the same number; there are now four runs a day. It asked for
          # three clean cowork spot-check days first — the live-row audit is stronger evidence
          # than a spot check and has come back clean twice: 1,159 active rows re-read against
          # their own pages, 486 verified, 0 corrections, 0.0% disagreement. Detection latency
          # is one sweep, because that audit runs at the end of every sweep.
          #
          # The cap was not bounding risk, it was acting as a whitelist. Spent first-come over a
          # roster order that never changes, it went to whoever was scraped first, every run,
          # forever. Measured 9 Sep 2026: first half of this roster held 361 live draws, last
          # half 155, with the SAME number of drafts dying in the queue; click-competitions sits
          # at position 58/59 with 26 dead drafts and 0 live while its own log lines read
          # "verified — publishing" every run; 142 rows in one run were held on "cap reached".
          # 277 drafts had already died unpublished, 84% of them with a category and nothing
          # else wrong. Ordering is fixed separately (rotateRoster + byPublishUrgency) so the
          # bias cannot come back at 200-300 operators; this raise clears the backlog now.
          # ROLLBACK TRIGGER: audit-report.json review count climbing run over run, or the
          # tripwire's publishable-drafts warning inverting into a live-inventory drop.
          AUTO_PUBLISH_MAX: "110"
          PER_OP_API: "60"
          BATCHES: "1"
          MAX_DRAWS: "3500"
          OP_BUDGET_MS: "480000"
          RUN_DEADLINE_MIN: "50" # stop cleanly before the 60min job kill

      - name: Auto-expire finished comps (active + draft) → status='ended'
        if: always() # runs even if the scrape partially failed, so the site stays clean
        run: bun ended-sweep.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: "false"
          # report = check every live row against the page this sweep is already reading, and
          # write nothing. Measured over 956 live rows on 2026-09-07: every correction the first
          # design proposed was wrong (a Cloudflare page as a title, dates moving into the past,
          # sold counters read as caps). AUDIT=apply is deliberately not set — turn it on only
          # with a measurement behind it. See lib/audit.mjs.
          AUDIT: "report"
          STATUS: "active,draft"

      # No tripwire step here on purpose. It opens/comments a GitHub issue, and running it four
      # times a day would comment four times on one bad morning. The render sweep still runs it
      # daily, and its `freshCount` check spans 24h, so a JSON-sweep breakage is caught there.
