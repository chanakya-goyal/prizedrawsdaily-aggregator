# Posts the Instagram Reel that the lunchtime run queued for this UK hour: no Mac, no Claude, one script.
#
# carousel/ig-publish.mjs reel asks carousel/autopilot/queue.mjs what is due (the carousel_posts row the lunchtime
# run wrote: slot window, not yet posted, draw still open), then makes the same three Instagram calls the Mac's
# slot run made, marks the row published and reads the post back. It posts exactly the video, cover and caption
# that were built and checked at lunchtime.
#
# THE MAC'S BACKUP. The Mac posts first (its slot job fires 17:45 and 18:45 UK, 07:45 and 08:45 UK); this
# fires LATER in the same window and posts only what the Mac did not. Both claim the row before posting
# (state.mjs claimPost), so the two can never post the same Reel. Scheduled runs need the repo variable
# AUTOPOST_CLOUD set to "backup" (or "1"); AUTOPOST_OFF=1 pauses. A manual start is a dry run unless unticked.
#
# Schedule (UTC), chosen so two starts land in each UK window, after the Mac's, in summer AND winter. A start
# outside a window does nothing; one after it unqueues a Reel that never posted (status skipped).
#   evening slot, 17:30–19:30 UK: 17:20, 18:00, 18:20, 19:00 UTC
#   morning slot, 07:30–09:30 UK: 07:20, 08:00, 08:20, 09:00 UTC
name: Instagram Reel slots

on:
  schedule:
    - cron: "20 17 * * *"
    - cron: "0 18 * * *"
    - cron: "20 18 * * *"
    - cron: "0 19 * * *"
    - cron: "20 7 * * *"
    - cron: "0 8 * * *"
    - cron: "20 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot (auto = whichever is open at this UK hour)"
        type: choice
        options: [auto, reel, reel-2]
        default: auto
      dry_run:
        description: "Dry run: say what is due, post nothing"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: instagram-reel-slots
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || 'auto' }}
      DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Post the Reel that is due
        run: |
          case "${{ vars.AUTOPOST_CLOUD }}" in 1|backup) ;; *) [ "${{ github.event_name }}" = schedule ] && { echo "cloud backup is off (AUTOPOST_CLOUD unset): the Mac posts"; exit 0; } ;; esac
          if [ "${{ vars.AUTOPOST_OFF }}" = "1" ] && [ "$DRY" != 1 ]; then echo "AUTOPOST_OFF=1: paused"; exit 0; fi
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY COMPOSIO_API_KEY; do
            [ -n "${!v}" ] || { gh workflow run autopost-watchdog.yml -f reason="Reel slot could not start: missing secret $v" || true; exit 1; }
          done
          # a dry run first proves the key in THIS environment reaches Instagram and the Page (read-only)
          [ "$DRY" = 1 ] && bun carousel/ig-publish.mjs ping
          set +e
          out=$(bun carousel/ig-publish.mjs reel "$SLOT" $([ "$DRY" = 1 ] && echo --dry-run) 2>&1); rc=$?
          set -e
          echo "$out"
          [ $rc -eq 3 ] && exit 0            # nothing due at this hour: not an error, no report
          day=$(TZ=Europe/London date +%Y-%m-%d)
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status=$([ $rc -eq 0 ] && echo PUBLISHED || echo FAILED); [ "$DRY" = 1 ] && status="$status (dry run)"
          log=$(gh issue list --label autopost-log --state open --json number --jq '.[0].number')
          [ -n "$log" ] && printf '**%s · Reel · %s** (cloud) · [run](%s)\n\n```\n%s\n```\n' "$day" "$status" "$run_url" "$(echo "$out" | tail -6)" | gh issue comment "$log" --body-file - || true
          if [ $rc -ne 0 ]; then
            gh workflow run autopost-watchdog.yml -f reason="Reel slot FAILED: $(echo "$out" | tail -2 | tr '\n' ' ' | cut -c1-220)" || true
            exit 1
          fi
