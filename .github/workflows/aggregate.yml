name: Daily draw aggregator (full sweep + auto-expire)

# Daily, keyless, no-AI. Two steps:
#   1. SCRAPE every operator — render/flaresolverr (browser) AND woo/shopify (JSON API, full
#      catalogue) — gate them, and insert NEW live comps as `draft` rows in Supabase. Dedup by
#      entry_url means existing draws are refreshed/skipped, so this only ADDS genuinely-new comps.
#   2. AUTO-EXPIRE — mark any ACTIVE or draft draw whose competition has finished (is_purchasable
#      === false) as `status='ended'`, so the live site never shows a closed comp.
# Drafts still publish via review (the cowork QA / vision routine) — this keeps the inventory
# fresh and self-cleaning without auto-publishing unverified prizes.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC (08:00 BST) every day
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

concurrency:
  group: aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # render at PER_OP 15 (~3× the page count) + full woo/shopify catalogue sweep
    permissions:
      contents: read
      issues: write # tripwire opens/updates an alarm issue when the pipeline breaks
    services:
      # Self-hosted Cloudflare solver for operators with "fetcher": "flaresolverr".
      # Keyless & free; reachable at http://localhost:8191 from the run step. No internal
      # health-cmd (the image lacks curl) — a wait step below polls it from the runner.
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: warning
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run parser/gate tests (scraper only — carousel suites need ffmpeg/Chromium and must never gate the scrape)
        run: bun run test:scraper

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8191/health >/dev/null 2>&1 || curl -fsS http://localhost:8191/ >/dev/null 2>&1; then
              echo "FlareSolverr is up"; exit 0
            fi
            echo "waiting for FlareSolverr ($i/40)…"; sleep 3
          done
          echo "::warning::FlareSolverr did not become ready — flaresolverr operators will fail-safe to 0 draws"

      - name: Scrape all operators (render + woo/shopify) → gate → insert drafts
        id: scrape
        run: bun run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLARESOLVERR_URL: http://localhost:8191/v1 # Cloudflare solver for flaresolverr operators
          DRY_RUN: "false"
          METHODS: "render,woo,shopify" # full daily sweep across every operator
          PUBLISH_STATUS: "draft" # land as draft; review/vision QA publishes (no unverified auto-publish)
          PER_OP: "15" # render per-op cap (raised from 5 for Operation 1000 depth)
          PER_OP_API: "60" # woo/shopify per-op cap (cheap JSON → whole live catalogue)
          BATCHES: "1"
          MAX_DRAWS: "3500" # backstop on pages read — covers all operators in one run
          OP_BUDGET_MS: "480000" # 8min hard cap per operator — no single op may monopolise the run
          RUN_DEADLINE_MIN: "130" # stop cleanly (flush + summary + exit 0) before the 150min job kill

      - name: Auto-expire finished comps (active + draft) → status='ended'
        if: always() # run even if the scrape step partially failed, so the site stays clean
        run: bun ended-sweep.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: "false"
          STATUS: "active,draft" # expire LIVE comps that have finished, plus stale drafts

      - name: Coverage report (DB operators × config × live counts)
        if: always() # the gap report is most valuable exactly when a step above broke
        run: bun manager/coverage-report.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Tripwire — alarm loudly if the pipeline is broken
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          TRIPWIRE_FLOOR: "350"
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bun manager/tripwire.mjs; then
            EXISTING=$(gh issue list --label tripwire --state open --json number -q '.[0].number' || true)
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body-file tripwire.md
            else
              gh label create tripwire --color B60205 --description "aggregator pipeline alarm" 2>/dev/null || true
              gh issue create --title "🔴 Aggregator tripwire: scrape broken or inventory under floor" \
                --label tripwire --body-file tripwire.md
            fi
            exit 1
          fi
